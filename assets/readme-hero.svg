<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">Phishing Email Classifier — project banner</title><desc id="desc">A modular scikit-learn pipeline that combines email text with lightweight security heuristics to classify messages as phishing or legitimate.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160C1B"/><stop offset=".58" stop-color="#3C1529"/><stop offset="1" stop-color="#0B1220"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FDA4AF"/><stop offset="1" stop-color="#E11D48"/></linearGradient><radialGradient id="glow"><stop stop-color="#E11D48" stop-opacity=".26"/><stop offset="1" stop-color="#E11D48" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C9D5E7" stroke-opacity=".07"/></pattern><style>@keyframes pulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1400px)}}.pulse{animation:pulse 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style></defs><rect width="1280" height="420" rx="28" fill="url(#bg)"/><rect width="1280" height="420" rx="28" fill="url(#grid)"/><ellipse cx="1010" cy="190" rx="310" ry="250" fill="url(#glow)"/><path d="M0 330C220 250 400 410 650 323S1030 283 1280 330" fill="none" stroke="#FDA4AF" stroke-opacity=".13" stroke-width="2"/><g font-family="Segoe UI,Inter,Arial,sans-serif"><text x="70" y="70" fill="#FDA4AF" font-size="14" font-weight="700" letter-spacing="3.4">CYBERSECURITY + MACHINE LEARNING</text><text x="68" y="145" fill="#F8FAFC" font-size="40" font-weight="760" letter-spacing="-1.1">Phishing Email Classifier</text><text x="72" y="194" fill="#E1D2DD" font-size="18">A modular scikit-learn pipeline that combines email text</text><text x="72" y="221" fill="#E1D2DD" font-size="18">with lightweight security heuristics to classify messages</text><rect x="72" y="252" width="410" height="3" rx="1.5" fill="url(#accent)"/><rect x="72" y="252" width="82" height="3" rx="1.5" fill="#FFF" opacity=".82" style="animation:sweep 8s linear infinite"/><rect x="72" y="286" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity=".035" stroke="#FDA4AF" stroke-opacity=".35"/><circle cx="89" cy="305" r="3" fill="#FDA4AF"/><text x="101" y="310" font-size="10.5" font-weight="700" letter-spacing=".9" fill="#F3E8EF">PYTHON + SCIKIT-LEARN</text><rect x="257" y="286" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity=".035" stroke="#FDA4AF" stroke-opacity=".35"/><circle cx="274" cy="305" r="3" fill="#FDA4AF"/><text x="286" y="310" font-size="10.5" font-weight="700" letter-spacing=".9" fill="#F3E8EF">TEXT + HEURISTICS</text><rect x="442" y="286" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity=".035" stroke="#FDA4AF" stroke-opacity=".35"/><circle cx="459" cy="305" r="3" fill="#FDA4AF"/><text x="471" y="310" font-size="10.5" font-weight="700" letter-spacing=".9" fill="#F3E8EF">CLI CLASSIFICATION</text><text x="72" y="382" fill="#BBA6B7" font-size="11" letter-spacing="2.8">TEXT SIGNALS · HEURISTICS · CLASSIFICATION</text></g><g transform="translate(1005 185)"><rect x="-139" y="-100" width="230" height="154" rx="17" fill="#100A17" stroke="#FDA4AF" stroke-opacity=".75" stroke-width="2"/><path d="M-132 -90L-24 -8L83 -90" fill="none" stroke="#FDA4AF" stroke-opacity=".75" stroke-width="2.5"/><rect x="-112" y="15" width="114" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".62"/><rect x="-112" y="32" width="84" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".25"/><path d="M104 -61L151 -42V-2Q151 39 104 56Q57 39 57 -2V-42Z" fill="#210D22" stroke="#E11D48" stroke-width="2.5"/><path d="M104 -31V9" stroke="#FDA4AF" stroke-width="7" stroke-line